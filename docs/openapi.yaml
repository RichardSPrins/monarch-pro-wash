      responses:
        '204': { description: Deleted. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key (`ap_live_…`) or OAuth access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Authenticated Autopilot user session (OAuth authorize step only).

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page's `next_cursor`.

  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing, invalid, expired, or revoked credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No such record for this company.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ChildList:
      description: Child rows for the parent record.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object }
    ChildCreated:
      description: The created child row.
      content:
        application/json:
          schema: { type: object }
    ChildUpdated:
      description: The updated child row.
      content:
        application/json:
          schema: { type: object }

  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, validation_error, conflict, rate_limited, internal]
            message: { type: string }
            details: {}
      example:
        error:
          code: validation_error
          message: Invalid request body

    Page:
      type: object
      properties:
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }

    JobStatus:
      type: string
      enum: [Open, On My Way, In Progress, Completed, Canceled, Pending Confirmation]
    InvoiceStatus:
      type: string
      enum: [Unsent, Unpaid, Partial, Paid, Overdue]
    EstimateStatus:
      type: string
      enum: [Unsent, Sent, Approved, Declined]
    DiscountType:
      type: string
      enum: [percentage, amount]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        field_tech: { type: boolean }
        subcontractor: { type: boolean }
        role_id: { type: integer, nullable: true }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        address2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        zip_code: { type: string }
        is_primary: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    AddressInput:
      type: object
      required: [address, city, state, zip_code]
      properties:
        address: { type: string }
        address2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        zip_code: { type: string }
        is_primary: { type: boolean, default: false }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    LineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        item_name: { type: string }
        item_price: { type: number }
        item_cost: { type: number }
        quantity: { type: number }
        taxable: { type: boolean }
        description: { type: string, nullable: true }
        payment_upfront: { type: boolean, nullable: true }

    LineItemInput:
      type: object
      required: [item_name, item_price]
      properties:
        item_name: { type: string }
        item_price: { type: number }
        item_cost: { type: number, default: 0 }
        quantity: { type: number, default: 1 }
        taxable: { type: boolean, default: true }
        description: { type: string, nullable: true }
        payment_upfront: { type: boolean, nullable: true }

    Discount:
      type: object
      properties:
        id: { type: string, format: uuid }
        discount_name: { type: string }
        discount_amount: { type: number }
        discount_type: { $ref: '#/components/schemas/DiscountType' }

    DiscountInput:
      type: object
      required: [discount_amount, discount_type]
      properties:
        discount_name: { type: string }
        discount_amount: { type: number }
        discount_type: { $ref: '#/components/schemas/DiscountType' }

    ScheduleInput:
      type: object
      required: [start_time, end_time]
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/JobStatus' }

    PaymentInput:
      type: object
      required: [payment_type, amount_base]
      properties:
        payment_type:
          type: string
          enum: [cash, check, cash_app, zelle, venmo, offline_credit_card, wire_transfer, ach, other]
        amount_base: { type: number, exclusiveMinimum: 0 }
        amount_tip: { type: number, minimum: 0, default: 0 }
        payment_date: { type: string, format: date-time }

    Totals:
      type: object
      description: Computed with the same math the Autopilot apps use.
      properties:
        subtotal: { type: number }
        discount_total: { type: number }
        tax_total: { type: number }
        total: { type: number }

    TaxRate:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rate: { type: number }

    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        primary_phone_number: { type: string, nullable: true }
        client_company_name: { type: string, nullable: true }
        client_notes: { type: string, nullable: true }
        client_or_lead: { type: string, enum: [client, lead] }
        date_became_client: { type: string, format: date-time, nullable: true }
        source_id: { type: string, format: uuid, nullable: true }
        is_do_not_service: { type: boolean }
        is_do_not_sms: { type: boolean }
        is_do_not_marketing_sms: { type: boolean }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        tags:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    ClientInput:
      type: object
      properties:
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        primary_phone_number: { type: string, nullable: true }
        client_company_name: { type: string, nullable: true }
        client_notes: { type: string, nullable: true }
        client_or_lead: { type: string, enum: [client, lead], default: client }
        source_id: { type: string, format: uuid, nullable: true }
        is_do_not_service: { type: boolean }
        is_do_not_sms: { type: boolean }
        is_do_not_marketing_sms: { type: boolean }
        addresses:
          type: array
          description: At most one may be primary; if none is marked, the first becomes primary.
          items: { $ref: '#/components/schemas/AddressInput' }
        tag_ids:
          type: array
          items: { type: string, format: uuid }

    ClientUpdate:
      type: object
      description: Any subset of the scalar ClientInput fields (no addresses/tag_ids).
      properties:
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        primary_phone_number: { type: string, nullable: true }
        client_company_name: { type: string, nullable: true }
        client_notes: { type: string, nullable: true }
        client_or_lead: { type: string, enum: [client, lead] }
        source_id: { type: string, format: uuid, nullable: true }
        is_do_not_service: { type: boolean }
        is_do_not_sms: { type: boolean }
        is_do_not_marketing_sms: { type: boolean }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        job_number: { type: integer }
        client_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        type: { type: string, nullable: true }
        job_source: { type: string, nullable: true }
        tags: { type: string, nullable: true }
        estimate_id: { type: string, format: uuid, nullable: true }
        unpaid_upfront: { type: boolean, nullable: true }
        address: { $ref: '#/components/schemas/Address' }
        tax_rate: { $ref: '#/components/schemas/TaxRate' }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        schedules:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              start_time: { type: string, format: date-time }
              end_time: { type: string, format: date-time }
              status: { $ref: '#/components/schemas/JobStatus' }
              assignee_user_ids:
                type: array
                items: { type: string, format: uuid }
        discounts:
          type: array
          items: { $ref: '#/components/schemas/Discount' }
        payments:
          type: array
          description: Payments recorded against the job (directly, or via its invoice).
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              payment_type: { type: string }
              payment_date: { type: string, format: date-time }
              amount_base: { type: number }
              amount_tip: { type: number, nullable: true }
              status: { type: string, nullable: true }
              confirmation_code: { type: string, nullable: true }
              invoice_id: { type: string, format: uuid, nullable: true }
        totals:
          allOf:
            - $ref: '#/components/schemas/Totals'
            - type: object
              properties:
                amount_paid: { type: number }
                amount_due: { type: number }

    JobInput:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        address_id: { type: string, format: uuid, nullable: true }
        job_source: { type: string, nullable: true }
        type:
          type: string
          nullable: true
          description: One of your company's job types. Defaults to null when omitted.
        tags: { type: string, nullable: true }
        tax_rate_id:
          type: string
          format: uuid
          nullable: true
          description: Defaults to your company's default tax rate when omitted.
        estimate_id: { type: string, format: uuid, nullable: true }
        unpaid_upfront: { type: boolean, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItemInput' }
        schedules:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ScheduleInput'
              - type: object
                properties:
                  assignee_user_ids:
                    type: array
                    items: { type: string, format: uuid }
        discounts:
          type: array
          items: { $ref: '#/components/schemas/DiscountInput' }

    JobUpdate:
      type: object
      description: Any subset of the scalar JobInput fields (no client_id/items/schedules/discounts).
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        address_id: { type: string, format: uuid, nullable: true }
        job_source: { type: string, nullable: true }
        type: { type: string, nullable: true }
        tags: { type: string, nullable: true }
        tax_rate_id: { type: string, format: uuid, nullable: true }
        estimate_id: { type: string, format: uuid, nullable: true }
        unpaid_upfront: { type: boolean, nullable: true }

    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        invoice_number: { type: integer }
        client_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        due_date: { type: string, format: date-time }
