  /v1/invoices/{invoiceId}/payments:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List payments
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ChildList' }
    post:
      summary: Record a manual payment
      description: The invoice status (Unpaid/Partial/Paid) recomputes automatically. Stripe payments cannot be recorded through the API.
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { $ref: '#/components/responses/ChildCreated' }

  /v1/invoices/{invoiceId}/payments/{paymentId}:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Delete a payment
      description: >-
        The invoice status recomputes automatically. To correct a payment,
        delete and re-record it. Only manual payments can be deleted — Stripe
        payments are managed by the Stripe flow and return 404 here.
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }

