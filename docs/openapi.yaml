  /v1/estimates/{estimateId}/items/{itemId}:
    parameters:
      - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a line item
      tags: [Estimates]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineItemInput' }
      responses:
        '200': { $ref: '#/components/responses/ChildUpdated' }
    delete:
      summary: Delete a line item
      tags: [Estimates]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }

  /v1/estimates/{estimateId}/discounts:
    parameters:
      - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List estimate discounts
      tags: [Estimates]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ChildList' }
    post:
      summary: Add a discount
      tags: [Estimates]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountInput' }
      responses:
        '201': { $ref: '#/components/responses/ChildCreated' }

  /v1/estimates/{estimateId}/discounts/{discountId}:
    parameters:
      - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: discountId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a discount
      tags: [Estimates]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
